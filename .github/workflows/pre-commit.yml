name: Run Pre-commit Hooks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code and fetch all branches
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensure the full history is fetched, not just the last commit

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          # dbt-checkpoint hooks are local (see .pre-commit-config.yaml): install it without
          # deps because mixpanel pins pydantic<2.12, which has no wheel for Python 3.14
          pip install --no-deps "git+https://github.com/dbt-checkpoint/dbt-checkpoint@v2.0.4"
          pip install --no-deps mixpanel
          pip install httpx asgiref json-logic==0.7.0a0
          pre-commit install --install-hooks

      # dbt-checkpoint reads target/manifest.json; parsing needs no DB connection, so a dummy profile is enough
      - name: Generate dbt manifest
        run: |
          . venv/bin/activate
          mkdir -p "$RUNNER_TEMP/dbt"
          cat > "$RUNNER_TEMP/dbt/profiles.yml" <<'EOF'
          dbtsupb:
            target: dev
            outputs:
              dev:
                type: postgres
                host: localhost
                user: dummy
                password: dummy
                port: 5432
                dbname: dummy
                schema: dev
                threads: 1
          EOF
          export DBT_PROFILES_DIR="$RUNNER_TEMP/dbt"
          dbt deps
          dbt parse

      # Fetch the main branch to ensure it's available for comparison
      - name: Fetch main branch
        run: git fetch origin main

      # Run pre-commit on all files changed between the current branch and main
      - name: Run pre-commit on all changed files
        run: |
          . venv/bin/activate
          # Get the list of files changed between the current branch and main
          files=$(git diff --name-only origin/main)
          if [ -n "$files" ]; then
            pre-commit run --files $files
          else
            echo "No modified files to check."
          fi
