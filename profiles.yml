dbtsupb:
  target: dev
  outputs:
    dev:
      type: postgres
      host: '{{env_var("DBT_HOST")}}'
      port: 5432
      dbname: '{{env_var("DBT_DBNAME")}}'
      user: '{{env_var("DBT_USER")}}'
      pass: '{{env_var("DBT_PASS")}}'
      schema: dev
      threads: 4

    ci:
      type: postgres
      host: '{{env_var("DBT_HOST")}}'
      port: 5432
      dbname: '{{env_var("DBT_DBNAME")}}'
      user: '{{env_var("DBT_USER")}}'
      pass: '{{env_var("DBT_PASS")}}'
      schema: ci
      threads: 4
